<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claramente · Recuperar contraseña</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png">
<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
<link rel="apple-touch-icon" href="/favicon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root { --sage: #4A7C6F; --sage-light: #E8F2EF; --sage-dark: #2C5048; --warm: #F7F3EE; --text: #1C2B28; --text-muted: #6B847E; --border: #D8E8E4; --white: #FFFFFF; --radius: 16px; }
body { font-family: 'DM Sans', sans-serif; background: var(--warm); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
nav { display: flex; align-items: center; padding: 18px 36px; border-bottom: 1px solid var(--border); }
.logo { font-family: 'Lora', serif; font-size: 20px; color: var(--text); text-decoration: none; letter-spacing: -0.02em; }
.logo span { color: var(--sage); font-style: italic; }
.wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
.card { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); padding: 36px; width: 100%; max-width: 420px; box-shadow: 0 4px 24px rgba(44,80,72,0.06); }
.card-title { font-family: 'Lora', serif; font-size: 22px; font-weight: 400; margin-bottom: 6px; }
.card-sub { font-size: 14px; color: var(--text-muted); margin-bottom: 28px; line-height: 1.6; }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
label { font-size: 13px; font-weight: 500; }
input { font-family: 'DM Sans', sans-serif; font-size: 14px; padding: 11px 16px; border: 1px solid var(--border); border-radius: 10px; background: var(--white); color: var(--text); outline: none; transition: border-color 0.2s; }
input:focus { border-color: #A8C8C0; }
.btn { width: 100%; font-size: 14px; padding: 12px; border-radius: 24px; border: none; background: var(--sage); color: white; cursor: pointer; font-family: 'DM Sans', sans-serif; font-weight: 500; margin-top: 8px; transition: background 0.18s; }
.btn:hover { background: var(--sage-dark); }
.btn:disabled { background: #A8C8C0; cursor: default; }
.msg { font-size: 13px; padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; display: none; }
.msg.ok { background: var(--sage-light); color: var(--sage-dark); display: block; }
.msg.error { background: #FDECEA; color: #C0392B; display: block; }
.back { display: block; text-align: center; margin-top: 16px; font-size: 13px; color: var(--text-muted); text-decoration: none; }
.back:hover { color: var(--sage); }
</style>
</head>
<body>
<nav><a class="logo" href="/">clara<span>mente</span></a></nav>
<div class="wrap">
  <div class="card">
    <div class="card-title">Recuperar contraseña</div>
    <div class="card-sub">Ingresá tu email y te mandamos un link para crear una nueva contraseña.</div>
    <div class="msg" id="msg"></div>
    <div class="field">
      <label>Email profesional</label>
      <input type="email" id="email" placeholder="tu@email.com" />
    </div>
    <button class="btn" id="btn" onclick="enviar()">Enviar link →</button>
    <a class="back" href="/login.html">← Volver al login</a>
  </div>
</div>
<script>
document.getElementById('email').addEventListener('keydown', e => { if (e.key === 'Enter') enviar(); });
async function enviar() {
  const email = document.getElementById('email').value.trim();
  const btn = document.getElementById('btn');
  const msg = document.getElementById('msg');
  if (!email) return;
  btn.disabled = true; btn.textContent = 'Enviando...';
  msg.className = 'msg';
  try {
    await fetch('/recuperar-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email })
    });
    msg.textContent = 'Si ese email está registrado, te llegará un link en los próximos minutos.';
    msg.className = 'msg ok';
    btn.textContent = 'Enviado ✓';
  } catch(e) {
    msg.textContent = 'Error de conexión. Intentá de nuevo.';
    msg.className = 'msg error';
    btn.disabled = false;
    btn.textContent = 'Enviar link →';
  }
}
</script>
</body>
</html>
