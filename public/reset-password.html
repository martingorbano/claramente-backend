<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claramente · Nueva contraseña</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root { --sage: #4A7C6F; --sage-light: #E8F2EF; --sage-dark: #2C5048; --warm: #F7F3EE; --text: #1C2B28; --text-muted: #6B847E; --border: #D8E8E4; --white: #FFFFFF; --radius: 16px; }
body { font-family: 'DM Sans', sans-serif; background: var(--warm); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
nav { display: flex; align-items: center; padding: 18px 36px; border-bottom: 1px solid var(--border); }
.logo { font-family: 'Lora', serif; font-size: 20px; color: var(--text); text-decoration: none; letter-spacing: -0.02em; }
.logo span { color: var(--sage); font-style: italic; }
.wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
.card { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); padding: 36px; width: 100%; max-width: 420px; box-shadow: 0 4px 24px rgba(44,80,72,0.06); }
.card-title { font-family: 'Lora', serif; font-size: 22px; font-weight: 400; margin-bottom: 6px; }
.card-sub { font-size: 14px; color: var(--text-muted); margin-bottom: 28px; }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
label { font-size: 13px; font-weight: 500; }
input { font-family: 'DM Sans', sans-serif; font-size: 14px; padding: 11px 16px; border: 1px solid var(--border); border-radius: 10px; background: var(--white); color: var(--text); outline: none; transition: border-color 0.2s; }
input:focus { border-color: #A8C8C0; }
.btn { width: 100%; font-size: 14px; padding: 12px; border-radius: 24px; border: none; background: var(--sage); color: white; cursor: pointer; font-family: 'DM Sans', sans-serif; font-weight: 500; margin-top: 8px; transition: background 0.18s; }
.btn:hover { background: var(--sage-dark); }
.btn:disabled { background: #A8C8C0; cursor: default; }
.msg { font-size: 13px; padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; display: none; }
.msg.ok { background: var(--sage-light); color: var(--sage-dark); display: block; }
.msg.error { background: #FDECEA; color: #C0392B; display: block; }
</style>
</head>
<body>
<nav><a class="logo" href="/">clara<span>mente</span></a></nav>
<div class="wrap">
  <div class="card">
    <div class="card-title">Nueva contraseña</div>
    <div class="card-sub">Elegí una contraseña segura de al menos 8 caracteres.</div>
    <div class="msg" id="msg"></div>
    <div class="field">
      <label>Nueva contraseña</label>
      <input type="password" id="pass1" placeholder="Mínimo 8 caracteres" />
    </div>
    <div class="field">
      <label>Confirmá la contraseña</label>
      <input type="password" id="pass2" placeholder="Repetí la contraseña" />
    </div>
    <button class="btn" id="btn" onclick="resetear()">Guardar contraseña →</button>
  </div>
</div>
<script>
const token = new URLSearchParams(window.location.search).get('token');
if (!token) window.location.href = '/login.html';

async function resetear() {
  const pass1 = document.getElementById('pass1').value;
  const pass2 = document.getElementById('pass2').value;
  const btn = document.getElementById('btn');
  const msg = document.getElementById('msg');
  msg.className = 'msg';

  if (pass1.length < 8) { msg.textContent = 'La contraseña debe tener al menos 8 caracteres.'; msg.className = 'msg error'; return; }
  if (pass1 !== pass2) { msg.textContent = 'Las contraseñas no coinciden.'; msg.className = 'msg error'; return; }

  btn.disabled = true; btn.textContent = 'Guardando...';
  try {
    const res = await fetch('/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, password: pass1 })
    });
    const data = await res.json();
    if (!res.ok) {
      msg.textContent = data.error || 'Error al actualizar la contraseña.';
      msg.className = 'msg error';
      btn.disabled = false; btn.textContent = 'Guardar contraseña →';
      return;
    }
    msg.textContent = '✓ Contraseña actualizada. Redirigiendo al login...';
    msg.className = 'msg ok';
    setTimeout(() => window.location.href = '/login.html', 2000);
  } catch(e) {
    msg.textContent = 'Error de conexión. Intentá de nuevo.';
    msg.className = 'msg error';
    btn.disabled = false; btn.textContent = 'Guardar contraseña →';
  }
}
</script>
</body>
</html>
